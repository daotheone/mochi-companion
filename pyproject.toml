[project]
name = "mochi-companion"
version = "0.1.0"
description = "A personal AI companion that lives on the desktop."
requires-python = ">=3.14"
dependencies = ["openai>=1.0"]

[project.scripts]
mochi = "companion.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
